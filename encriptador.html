<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Strings Encriptados</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            background-color: #121212; /* Fondo muy oscuro */
            color: #e0e0e0;
            font-family: monospace; /* Fuente tipo código */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #333;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        h3 {
            margin-top: 0;
            color: #fff;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 0.85rem;
            color: #888;
        }

        input {
            width: 100%;
            background: #252525;
            border: 1px solid #444;
            color: #0f0; /* Color verde hacker para ver bien lo que escribes */
            padding: 12px;
            font-family: monospace;
            font-size: 1rem;
            border-radius: 4px;
            box-sizing: border-box;
            margin-top: 5px;
        }

        input:focus {
            outline: none;
            border-color: #0d6efd;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        button:hover {
            background-color: #0b5ed7;
        }

        .result-box {
            margin-top: 25px;
            background: #000;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 4px;
            position: relative;
        }

        .result-label {
            position: absolute;
            top: -10px;
            left: 10px;
            background: #0d6efd;
            color: white;
            padding: 2px 8px;
            font-size: 0.7rem;
            border-radius: 4px;
        }

        #output {
            word-break: break-all;
            color: #ffc107; /* Amarillo para diferenciar el resultado */
            font-size: 0.9rem;
        }

        .copy-hint {
            text-align: center;
            font-size: 0.75rem;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>Generador de Encriptación (AES)</h3>

        <label>Dato sensible (API Key, Contraseña, etc.):</label>
        <input type="text" id="secretData" placeholder="Ej: mi_password_super_secreto_123">

        <label>Llave de encriptación (Tu Secret Key):</label>
        <input type="text" id="passphrase" placeholder="Ej: llave-maestra-app-v1">

        <button onclick="encryptData()">GENERAR STRING ENCRIPTADO</button>

        <div class="result-box" id="resultBox" style="display:none;">
            <span class="result-label">RESULTADO (AES)</span>
            <div id="output"></div>
        </div>
        <p class="copy-hint" id="copyHint" style="display:none;">Haz clic en el texto amarillo para copiar</p>
    </div>

    <script>
        function encryptData() {
            const data = document.getElementById('secretData').value;
            const pass = document.getElementById('passphrase').value;
            
            if(!data || !pass) {
                alert("Necesito el dato y la llave para generar el código.");
                return;
            }

            // Encriptamos
            const encrypted = CryptoJS.AES.encrypt(data, pass).toString();

            // Mostramos resultado
            const output = document.getElementById('output');
            output.innerText = encrypted;
            
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('copyHint').style.display = 'block';
        }

        // Copiar al hacer clic en el resultado
        document.getElementById('output').addEventListener('click', function() {
            navigator.clipboard.writeText(this.innerText).then(() => {
                const original = this.style.color;
                this.style.color = '#fff'; // Flash blanco
                setTimeout(() => { this.style.color = original; }, 200);
                alert("Copiado: " + this.innerText.substring(0, 20) + "...");
            });
        });
    </script>
</body>
</html>
